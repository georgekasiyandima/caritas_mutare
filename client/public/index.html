      content="Caritas Mutare — the development and humanitarian arm of the Catholic Diocese of Mutare, Zimbabwe — delivering food, livelihoods, inclusion, WASH and emergency response rooted in Catholic Social Teaching."
    />

    <!-- Open Graph -->

    <meta property="og:type" content="website" />

      property="og:description"

      content="Zimbabwe — delivering food, livelihoods, inclusion, WASH and emergency response rooted in Catholic Social Teaching."

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
    />
    <title>Caritas Mutare — Caritas Zimbabwe Diocese of Mutare</title>
    <style>
      html, body { background: #faf9f7; margin: 0; }
      #boot-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        font-family: Georgia, "Times New Roman", serif;
      }
      #boot-splash img { height: 64px; max-width: 72vw; object-fit: contain; }
      #boot-splash .bar {
        width: 120px;
        height: 3px;
        border-radius: 999px;
        background: rgba(125, 0, 0, 0.12);
        overflow: hidden;
      }
      #boot-splash .bar span {
        display: block;
        width: 40%;
        height: 100%;
        background: #7D0000;
        animation: boot-bar 1.1s ease-in-out infinite;
      }
      @keyframes boot-bar {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div id="boot-splash" aria-hidden="true">
        <img src="%PUBLIC_URL%/images/logo/caritas-mutare-clear.png" alt="" />
        <div class="bar"><span></span></div>
      </div>
    </div>
  </body>
</html>
