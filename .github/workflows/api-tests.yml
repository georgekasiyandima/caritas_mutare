name: API tests

on:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/api-tests.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/api-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
