name: API tests

on:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/api-tests.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/api-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: caritas
          POSTGRES_PASSWORD: caritas
          POSTGRES_DB: caritas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caritas -d caritas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Throwaway database for this job. Not the Neon production URL.
      TEST_DATABASE_URL: postgres://caritas:caritas@localhost:5432/caritas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        # One database, so the two test files must not run in parallel.
        run: npx jest --runInBand
